<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcatdia GP & MIDI 雙核心工作站</title>
  <!-- 1. AlphaTab: 解析 GP 檔案及原軌試聽 -->
  <script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@latest/dist/alphaTab.js"></script>
  <!-- 2. MidiPlayerJS & Tone.js: 生成純 MIDI 檔案本地實時試聽 -->
  <script src="https://cdn.jsdelivr.net/npm/midi-player-js@2.0.16/browser/midiplayer.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f13;
      color: #eee;
      padding: 16px;
      margin: 0;
      max-width: 550px;
      margin: auto;
    }
    h2 { color: #00d2ff; text-align: center; margin-bottom: 4px; }
    p.desc { text-align: center; color: #777; font-size: 12px; margin-top: 0; }
    .card {
      background: #191922;
      border: 1px solid #282836;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    input[type="file"] {
      display: block;
      width: 100%;
      padding: 12px;
      background: #232330;
      border: 1px dashed #444;
      border-radius: 8px;
      color: #fff;
    }
    .track-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 4px;
      border-bottom: 1px solid #22222e;
    }
    .track-row:last-child { border-bottom: none; }
    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-main { background: #00d2ff; color: #000; }
    .btn-action { background: #333346; color: #00d2ff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    .btn-midi-play { background: #4ade80; color: #000; font-size: 13px; padding: 8px 16px; font-weight: bold; }
    
    #statusBox {
      background: #050508;
      border: 1px solid #00d2ff;
      border-radius: 8px;
      padding: 10px 12px;
      font-family: monospace;
      font-size: 12px;
      margin-top: 10px;
      line-height: 1.4;
      word-break: break-all;
    }
    .log-info { color: #00d2ff; }
    .log-success { color: #4ade80; font-weight: bold; }
    .log-error { color: #ff3366; font-weight: bold; background: rgba(255, 51, 102, 0.1); padding: 4px; border-radius: 4px; }
    
    /* 🎯 播放進度控制面板 */
    .seek-container {
      background: #14141c;
      border: 1px solid #33334a;
      border-radius: 8px;
      padding: 12px;
      margin: 12px 0;
    }
    .seek-meta {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-family: monospace;
      color: #00d2ff;
      margin-bottom: 6px;
    }
    .seek-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 4px;
      background: #2b2b3d;
      outline: none;
    }
    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #00d2ff;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0,210,255,0.6);
    }

    .midi-box {
      background: #121218;
      border: 1.5px solid #4ade80;
      border-radius: 8px;
      padding: 12px;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <h2>🎸 GP 拆軌 & MIDI 雙試聽工作站</h2>
  <p class="desc">發達煙定・純前端零依賴・自選小節/時間播放</p>

  <div id="statusBox">
    <div id="statusText" class="log-info">⚙️ 系統準備就緒，等待樂譜...</div>
  </div>

  <div class="card" style="margin-top: 12px;">
    <label style="display:block; font-weight:bold; margin-bottom:8px;">1. 選擇 GP 樂譜 (.gp3, .gp4, .gp5)</label>
    <input type="file" id="filePicker" accept=".gp3,.gp4,.gp5,.gpx,.gp">
  </div>

  <div id="gpCard" class="card" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <div>
        <div id="songTitle" style="font-weight:bold; font-size:16px; color:#fff;"></div>
        <div id="songTempo" style="font-size:12px; color:#888;"></div>
      </div>
      <button class="btn-action" id="gpPlayBtn" style="font-size:13px; padding:8px 12px;">▶ GTP 播放</button>
    </div>

    <!-- 🎯 小節 (Bar) 與時間 (Time) 控制拉桿 -->
    <div class="seek-container">
      <div class="seek-meta">
        <span id="barDisplay">小節: 1 / 1</span>
        <span id="timeDisplay">00:00 / 00:00</span>
      </div>
      <input type="range" id="seekSlider" class="seek-slider" min="0" max="100" value="0">
    </div>

    <label style="font-weight:bold; font-size:13px; display:block; margin-bottom:6px; color:#00d2ff;">2. 選擇你要合成的多音軌：</label>
    <div id="trackList"></div>

    <button class="btn btn-main" id="generateMidiBtn">⚡ 提煉所選音軌生成 MIDI</button>

    <div id="midiArea" class="midi-box" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span style="font-size:13px; font-weight:bold; color:#4ade80;">🎹 生成的 MIDI 已就緒：</span>
        <button class="btn-action btn-midi-play" id="midiPlayBtn">▶ 試聽生成 MIDI</button>
      </div>
      <button class="btn" id="downloadMidiBtn" style="background:#4ade80; color:#000;">📥 下載此 MIDI 檔案</button>
    </div>
  </div>

  <div id="alphaTabEngine" style="display:none;"></div>

  <script>
    let api = null;
    let rawScoreBytes = null;
    let currentScore = null;
    let isGpPlaying = false;
    let totalMasterBars = 1;
    let totalDurationMs = 0;
    let isUserSeeking = false;

    let midiPlayer = null;
    let synth = null;
    let currentMidiBytes = null;
    let isMidiPlaying = false;

    const statusText = document.getElementById('statusText');
    const barDisplay = document.getElementById('barDisplay');
    const timeDisplay = document.getElementById('timeDisplay');
    const seekSlider = document.getElementById('seekSlider');

    function logStatus(msg, type = 'info') {
      if (!statusText) return;
      statusText.className = type === 'error' ? 'log-error' : (type === 'success' ? 'log-success' : 'log-info');
      statusText.innerText = msg;
    }

    function formatTime(ms) {
      const totalSec = Math.floor(ms / 1000);
      const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
      const s = (totalSec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      try {
        const container = document.getElementById('alphaTabEngine');
        api = new alphaTab.AlphaTabApi(container, {
          player: {
            enablePlayer: true,
            soundFont: 'https://cdn.jsdelivr.net/npm/@coderline/alphatab@latest/dist/soundfont/sonivox.sf2'
          }
        });

        api.soundFontLoaded.on(() => {
          logStatus('✅ 音訊 SoundFont 載入完成，請載入樂譜！', 'success');
        });

        api.playerStateChanged.on((args) => {
          isGpPlaying = (args.state === 1);
          document.getElementById('gpPlayBtn').innerText = isGpPlaying ? '⏹ 停止 GTP' : '▶ GTP 播放';
        });

        // 🎯 核心進度監聽：隨播放自動更新時間與小節
        api.playerPositionChanged.on((args) => {
          if (isUserSeeking) return; // 使用者拖曳時不打擾

          totalDurationMs = args.endTime;
          const currentMs = args.currentTime;
          timeDisplay.innerText = `${formatTime(currentMs)} / ${formatTime(totalDurationMs)}`;

          // 計算小節
          if (totalDurationMs > 0 && totalMasterBars > 0) {
            const ratio = Math.min(1, currentMs / totalDurationMs);
            const currentBar = Math.max(1, Math.min(totalMasterBars, Math.floor(ratio * totalMasterBars) + 1));
            barDisplay.innerText = `小節: Bar ${currentBar} / ${totalMasterBars}`;
            seekSlider.value = Math.floor(ratio * 1000);
          }
        });

        // 初始化 Tone.js
        synth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: "triangle" },
          envelope: { attack: 0.005, decay: 0.1, sustain: 0.3, release: 1 }
        }).toDestination();

        midiPlayer = new MidiPlayer.Player((event) => {
          if (event.name === 'Note on' && event.velocity > 0) {
            try {
              const freq = Tone.Frequency(event.noteNumber, "midi");
              synth.triggerAttackRelease(freq, "8n", undefined, event.velocity / 127);
            } catch(e) {}
          }
        });

        midiPlayer.on('endOfFile', () => {
          isMidiPlaying = false;
          document.getElementById('midiPlayBtn').innerText = '▶ 試聽生成 MIDI';
        });
      } catch(err) {
        logStatus(`❌ 初始化失敗: ${err.message}`, 'error');
      }
    });

    const filePicker = document.getElementById('filePicker');
    const gpCard = document.getElementById('gpCard');
    const trackList = document.getElementById('trackList');
    const midiArea = document.getElementById('midiArea');
    const midiPlayBtn = document.getElementById('midiPlayBtn');

    filePicker.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      logStatus(`⏳ 正在讀取樂譜: ${file.name}...`, 'info');
      try {
        const arrayBuffer = await file.arrayBuffer();
        rawScoreBytes = new Uint8Array(arrayBuffer);

        currentScore = alphaTab.importer.ScoreLoader.loadScoreFromBytes(rawScoreBytes);
        api.renderScore(currentScore);

        totalMasterBars = currentScore.masterBars ? currentScore.masterBars.length : (currentScore.tracks[0]?.measures?.length || 1);
        seekSlider.max = 1000;
        seekSlider.value = 0;
        barDisplay.innerText = `小節: Bar 1 / ${totalMasterBars}`;
        timeDisplay.innerText = `00:00 / 00:00`;

        document.getElementById('songTitle').innerText = currentScore.title || file.name;
        document.getElementById('songTempo').innerText = `原曲速度: ${currentScore.tempo} BPM`;

        trackList.innerHTML = '';
        currentScore.tracks.forEach((track, index) => {
          const row = document.createElement('div');
          row.className = 'track-row';
          row.innerHTML = `
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
              <input type="checkbox" class="track-cb" data-index="${index}" checked>
              <span style="font-size:14px;">${track.name || `軌道 ${index + 1}`}</span>
            </label>
            <div>
              <button class="btn-action" onclick="soloPlayTrack(${index})">獨奏 GTP</button>
            </div>
          `;
          trackList.appendChild(row);
        });

        gpCard.style.display = 'block';
        midiArea.style.display = 'none';
        logStatus(`✅ 樂譜解析成功！共 ${totalMasterBars} 個小節，隨時可拖動播放。`, 'success');
      } catch (err) {
        logStatus(`❌ 解析 GP 樂譜失敗: ${err.message}`, 'error');
      }
    });

    // 🎯 拖動進度條：動態即時跳轉
    seekSlider.addEventListener('input', (e) => {
      isUserSeeking = true;
      const ratio = e.target.value / 1000;
      const targetBar = Math.max(1, Math.min(totalMasterBars, Math.floor(ratio * totalMasterBars) + 1));
      barDisplay.innerText = `小節: Bar ${targetBar} / ${totalMasterBars} (放手播放)`;
      if (totalDurationMs > 0) {
        timeDisplay.innerText = `${formatTime(ratio * totalDurationMs)} / ${formatTime(totalDurationMs)}`;
      }
    });

    seekSlider.addEventListener('change', (e) => {
      isUserSeeking = false;
      const ratio = e.target.value / 1000;
      const targetMs = ratio * totalDurationMs;
      
      // 指揮 AlphaTab 跳轉至指定時間播放
      if (api) {
        api.tickPosition = Math.floor(ratio * (api.player?.totalTicks || 10000));
        if (!isGpPlaying) {
          api.play();
        }
      }
      logStatus(`🎯 已跳轉至進度: ${Math.floor(ratio * 100)}% (Bar ${Math.floor(ratio * totalMasterBars) + 1})`, 'info');
    });

    // GTP 播放 / 暫停
    document.getElementById('gpPlayBtn').addEventListener('click', () => {
      if (!api) return;
      if (isMidiPlaying) stopMidi();
      api.playPause();
    });

    window.soloPlayTrack = function(index) {
      if (!api || !currentScore) return;
      if (isMidiPlaying) stopMidi();
      currentScore.tracks.forEach((t, i) => {
        api.changeTrackMute([t], i !== index);
      });
      if (!isGpPlaying) api.play();
      logStatus(`🎵 正在獨奏軌道: ${currentScore.tracks[index].name || (index + 1)}`, 'info');
    };

    // 提煉音軌生成 MIDI
    document.getElementById('generateMidiBtn').addEventListener('click', () => {
      logStatus('⚡ 正在提煉音軌數據...', 'info');
      if (!rawScoreBytes) return;

      try {
        const exportScoreObj = alphaTab.importer.ScoreLoader.loadScoreFromBytes(rawScoreBytes);
        const selectedIndices = Array.from(document.querySelectorAll('.track-cb:checked'))
          .map(cb => parseInt(cb.getAttribute('data-index'), 10));

        if (selectedIndices.length === 0) {
          logStatus('⚠️ 請至少勾選一條音軌！', 'error');
          return;
        }

        exportScoreObj.tracks = exportScoreObj.tracks.filter((t, idx) => selectedIndices.includes(idx));

        let midiFile = null;
        if (alphaTab.midi && alphaTab.midi.MidiFile && typeof alphaTab.midi.MidiFile.fromScore === 'function') {
          midiFile = alphaTab.midi.MidiFile.fromScore(exportScoreObj);
        } else if (alphaTab.exporter && alphaTab.exporter.MidiExport) {
          midiFile = alphaTab.exporter.MidiExport.exportScore(exportScoreObj);
        } else {
          exportScoreObj.finish();
          midiFile = alphaTab.midi.MidiFile.fromScore(exportScoreObj);
        }

        currentMidiBytes = (typeof midiFile.toBinary === 'function') ? midiFile.toBinary() : new Uint8Array(midiFile);

        midiArea.style.display = 'block';
        logStatus(`🎉 成功提煉 ${selectedIndices.length} 條音軌，請試聽或下載！`, 'success');
      } catch (err) {
        logStatus(`❌ 生成 MIDI 發生錯誤: ${err.message}`, 'error');
      }
    });

    // MIDI 試聽
    midiPlayBtn.addEventListener('click', async () => {
      if (!currentMidiBytes) return;
      if (isGpPlaying) api.pause();

      await Tone.start();
      if (isMidiPlaying) {
        stopMidi();
      } else {
        try {
          const ab = currentMidiBytes.buffer.slice(currentMidiBytes.byteOffset, currentMidiBytes.byteOffset + currentMidiBytes.byteLength);
          midiPlayer.loadArrayBuffer(ab);
          midiPlayer.play();
          isMidiPlaying = true;
          midiPlayBtn.innerText = '⏹ 停止 MIDI';
          logStatus('▶ 正在試聽生成的 MIDI 檔案...', 'success');
        } catch(err) {
          logStatus(`❌ MIDI 試聽失敗: ${err.message}`, 'error');
        }
      }
    });

    function stopMidi() {
      if (midiPlayer) midiPlayer.stop();
      isMidiPlaying = false;
      midiPlayBtn.innerText = '▶ 試聽生成 MIDI';
    }

    // 下載 MIDI
    document.getElementById('downloadMidiBtn').addEventListener('click', () => {
      if (!currentMidiBytes) return;
      const blob = new Blob([currentMidiBytes], { type: 'audio/midi' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${currentScore.title || 'extracted'}_custom.mid`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      logStatus('📥 MIDI 檔案下載完成！', 'success');
    });
  </script>
</body>
</html>
