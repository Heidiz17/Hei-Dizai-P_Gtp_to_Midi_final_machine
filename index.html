<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcatdia GP & MIDI 雙核心工作站</title>
  <script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.3.0/dist/alphaTab.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/midi-player-js@2.0.16/browser/midiplayer.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f13;
      color: #eee;
      padding: 16px;
      margin: 0;
      max-width: 550px;
      margin: auto;
    }
    h2 { color: #00d2ff; text-align: center; margin-bottom: 4px; font-size: 20px; }
    p.desc { text-align: center; color: #4ade80; font-size: 13px; margin-top: 0; font-weight: bold; }
    .card {
      background: #191922;
      border: 1px solid #282836;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    input[type="file"] {
      display: block;
      width: 100%;
      padding: 12px;
      background: #232330;
      border: 1px dashed #444;
      border-radius: 8px;
      color: #fff;
    }
    .track-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 4px;
      border-bottom: 1px solid #22222e;
    }
    .track-row:last-child { border-bottom: none; }
    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-main { background: #00d2ff; color: #000; }
    .btn-action { background: #333346; color: #00d2ff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    .btn-midi-play { background: #4ade80; color: #000; font-size: 13px; padding: 8px 16px; font-weight: bold; }
    
    #statusBox {
      background: #050508;
      border: 1px solid #00d2ff;
      border-radius: 8px;
      padding: 10px 12px;
      font-family: monospace;
      font-size: 12px;
      margin-top: 10px;
      line-height: 1.4;
      word-break: break-all;
    }
    .log-info { color: #00d2ff; }
    .log-success { color: #4ade80; font-weight: bold; }
    .log-error { color: #ff3366; font-weight: bold; }
    
    .seek-container {
      background: #14141c;
      border: 1px solid #33334a;
      border-radius: 8px;
      padding: 12px;
      margin: 12px 0;
    }
    .seek-meta {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-family: monospace;
      color: #00d2ff;
      margin-bottom: 6px;
    }
    .seek-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 4px;
      background: #2b2b3d;
      outline: none;
    }
    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #00d2ff;
      cursor: pointer;
    }

    .bar-btn-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 10px;
    }
    .btn-step {
      background: #252536;
      color: #00d2ff;
      border: 1px solid #3b3b52;
      border-radius: 6px;
      padding: 8px 0;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-step:active {
      background: #00d2ff;
      color: #000;
    }

    .midi-box {
      background: #121218;
      border: 1.5px solid #4ade80;
      border-radius: 8px;
      padding: 12px;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <h2>🎸 GP 拆軌 & MIDI 雙試聽工作站</h2>
  <p class="desc">⚡ v4.1 防禦安全純淨版</p>

  <div id="statusBox">
    <div id="statusText" class="log-info">⚙️ 系統就緒，等待樂譜...</div>
  </div>

  <div class="card" style="margin-top: 12px;">
    <label style="display:block; font-weight:bold; margin-bottom:8px;">1. 選擇 GP 樂譜 (.gp3, .gp4, .gp5)</label>
    <input type="file" id="filePicker" accept=".gp3,.gp4,.gp5,.gpx,.gp">
  </div>

  <div id="gpCard" class="card" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <div>
        <div id="songTitle" style="font-weight:bold; font-size:16px; color:#fff;"></div>
        <div id="songTempo" style="font-size:12px; color:#888;"></div>
      </div>
      <button class="btn-action" id="gpPlayBtn" style="font-size:13px; padding:8px 12px;">▶ GTP 播放</button>
    </div>

    <div class="seek-container">
      <div class="seek-meta">
        <span id="barDisplay">小節: Bar 1 / 1</span>
        <span id="timeDisplay">00:00 / 00:00</span>
      </div>
      <input type="range" id="seekSlider" class="seek-slider" min="1" max="100" value="1">
      
      <div class="bar-btn-group">
        <button class="btn-step" onclick="stepBar(-4)">⏪ -4 Bar</button>
        <button class="btn-step" onclick="stepBar(-1)">◀ -1 Bar</button>
        <button class="btn-step" onclick="stepBar(1)">+1 Bar ▶</button>
        <button class="btn-step" onclick="stepBar(4)">+4 Bar ⏩</button>
      </div>
    </div>

    <label style="font-weight:bold; font-size:13px; display:block; margin-bottom:6px; color:#00d2ff;">2. 選擇你要合成的多音軌：</label>
    <div id="trackList"></div>

    <button class="btn btn-main" id="generateMidiBtn">⚡ 提煉所選音軌生成 MIDI</button>

    <div id="midiArea" class="midi-box" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span style="font-size:13px; font-weight:bold; color:#4ade80;">🎹 生成的 MIDI 已就緒：</span>
        <button class="btn-action btn-midi-play" id="midiPlayBtn">▶ 試聽生成 MIDI</button>
      </div>
      <button class="btn" id="downloadMidiBtn" style="background:#4ade80; color:#000;">📥 下載此 MIDI 檔案 (.mid)</button>
    </div>
  </div>

  <div id="alphaTabEngine" style="display:none;"></div>

  <script>
    let api = null;
    let currentScore = null;
    let isGpPlaying = false;
    let totalBars = 1;
    let currentBarIndex = 1;
    let isUserDragging = false;

    let midiPlayer = null;
    let synth = null;
    let currentMidiUint8 = null;
    let isMidiPlaying = false;

    const statusText = document.getElementById('statusText');
    const barDisplay = document.getElementById('barDisplay');
    const timeDisplay = document.getElementById('timeDisplay');
    const seekSlider = document.getElementById('seekSlider');

    function logStatus(msg, type = 'info') {
      if (!statusText) return;
      statusText.className = type === 'error' ? 'log-error' : (type === 'success' ? 'log-success' : 'log-info');
      statusText.innerText = msg;
    }

    function formatTime(ms) {
      const totalSec = Math.floor((ms || 0) / 1000);
      const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
      const s = (totalSec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('alphaTabEngine');
      api = new alphaTab.AlphaTabApi(container, {
        player: {
          enablePlayer: true,
          soundFont: 'https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.3.0/dist/soundfont/sonivox.sf2'
        }
      });

      api.soundFontLoaded.on(() => {
        logStatus('✅ 音效引擎就緒，請選擇樂譜！', 'success');
      });

      api.playerStateChanged.on((args) => {
        isGpPlaying = (args.state === 1);
        document.getElementById('gpPlayBtn').innerText = isGpPlaying ? '⏹ 停止 GTP' : '▶ GTP 播放';
      });

      api.playerPositionChanged.on((args) => {
        if (isUserDragging) return;
        timeDisplay.innerText = `${formatTime(args.currentTime)} / ${formatTime(args.endTime)}`;
        if (args.currentMasterBar) {
          currentBarIndex = args.currentMasterBar.index + 1;
          barDisplay.innerText = `小節: Bar ${currentBarIndex} / ${totalBars}`;
          seekSlider.value = currentBarIndex;
        }
      });

      synth = new Tone.PolySynth(Tone.Synth).toDestination();
      midiPlayer = new MidiPlayer.Player((event) => {
        if (event.name === 'Note on' && event.velocity > 0) {
          try {
            synth.triggerAttackRelease(Tone.Frequency(event.noteNumber, "midi"), "8n", undefined, event.velocity / 127);
          } catch(e) {}
        }
      });

      midiPlayer.on('endOfFile', () => {
        isMidiPlaying = false;
        document.getElementById('midiPlayBtn').innerText = '▶ 試聽生成 MIDI';
      });
    });

    const filePicker = document.getElementById('filePicker');
    const gpCard = document.getElementById('gpCard');
    const trackList = document.getElementById('trackList');
    const midiArea = document.getElementById('midiArea');
    const midiPlayBtn = document.getElementById('midiPlayBtn');

    filePicker.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      logStatus(`⏳ 讀取樂譜: ${file.name}...`, 'info');
      try {
        const arrayBuffer = await file.arrayBuffer();
        const rawBytes = new Uint8Array(arrayBuffer);

        currentScore = alphaTab.importer.ScoreLoader.loadScoreFromBytes(rawBytes);
        api.renderScore(currentScore);

        totalBars = currentScore.masterBars ? currentScore.masterBars.length : 1;
        currentBarIndex = 1;
        seekSlider.min = 1;
        seekSlider.max = totalBars;
        seekSlider.value = 1;
        barDisplay.innerText = `小節: Bar 1 / ${totalBars}`;
        timeDisplay.innerText = `00:00 / 00:00`;

        document.getElementById('songTitle').innerText = currentScore.title || file.name;
        document.getElementById('songTempo').innerText = `原曲速度: ${currentScore.tempo || 120} BPM`;

        trackList.innerHTML = '';
        if (currentScore.tracks) {
          currentScore.tracks.forEach((track, index) => {
            const row = document.createElement('div');
            row.className = 'track-row';
            row.innerHTML = `
              <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                <input type="checkbox" class="track-cb" data-index="${index}" checked>
                <span style="font-size:14px;">${track.name || `軌道 ${index + 1}`}</span>
              </label>
              <div>
                <button class="btn-action" onclick="soloPlayTrack(${index})">獨奏 GTP</button>
              </div>
            `;
            trackList.appendChild(row);
          });
        }

        gpCard.style.display = 'block';
        midiArea.style.display = 'none';
        logStatus(`✅ 樂譜加載完成！共 ${totalBars} 小節。`, 'success');
      } catch (err) {
        logStatus(`❌ 解析失敗: ${err.message}`, 'error');
      }
    });

    function jumpToBar(target) {
      if (!api || !currentScore || !currentScore.masterBars) return;
      currentBarIndex = Math.max(1, Math.min(totalBars, target));
      seekSlider.value = currentBarIndex;
      barDisplay.innerText = `小節: Bar ${currentBarIndex} / ${totalBars}`;

      const masterBar = currentScore.masterBars[currentBarIndex - 1];
      if (masterBar) {
        api.tickPosition = masterBar.start;
        logStatus(`🎯 已定位至第 ${currentBarIndex} 小節`, 'info');
        if (!isGpPlaying) api.play();
      }
    }

    window.stepBar = function(offset) {
      jumpToBar(currentBarIndex + offset);
    };

    seekSlider.addEventListener('input', (e) => {
      isUserDragging = true;
      const target = parseInt(e.target.value, 10);
      barDisplay.innerText = `小節: Bar ${target} / ${totalBars} (放手定位)`;
    });

    seekSlider.addEventListener('change', (e) => {
      isUserDragging = false;
      jumpToBar(parseInt(e.target.value, 10));
    });

    document.getElementById('gpPlayBtn').addEventListener('click', () => {
      if (!api) return;
      if (isMidiPlaying) stopMidi();
      api.playPause();
    });

    window.soloPlayTrack = function(index) {
      if (!api || !currentScore || !currentScore.tracks) return;
      if (isMidiPlaying) stopMidi();
      currentScore.tracks.forEach((t, i) => {
        api.changeTrackMute([t], i !== index);
      });
      if (!isGpPlaying) api.play();
      logStatus(`🎵 正在獨奏: ${currentScore.tracks[index].name || (index + 1)}`, 'info');
    };

    // 🎯 具有極強防禦性的原生二進制 MIDI 編碼器
    function buildNativeMidi(tracksData, tempo) {
      function numToBytes(num, bytes) {
        const res = [];
        for (let i = bytes - 1; i >= 0; i--) {
          res.push((num >> (i * 8)) & 0xFF);
        }
        return res;
      }
      function writeVarInt(value) {
        let buffer = value & 0x7F;
        const bytes = [];
        while ((value >>= 7)) {
          buffer <<= 8;
          buffer |= ((value & 0x7F) | 0x80);
        }
        while (true) {
          bytes.push(buffer & 0xFF);
          if (buffer & 0x80) buffer >>= 8;
          else break;
        }
        return bytes;
      }

      const ticksPerBeat = 96;
      const microsecondsPerBeat = Math.round(60000000 / (tempo || 120));
      const tracksBytes = [];

      tracksData.forEach((tEvents, chIdx) => {
        let trackBytes = [];
        if (chIdx === 0) {
          trackBytes.push(0x00, 0xFF, 0x51, 0x03, 
            (microsecondsPerBeat >> 16) & 0xFF, 
            (microsecondsPerBeat >> 8) & 0xFF, 
            microsecondsPerBeat & 0xFF
          );
        }

        let lastTick = 0;
        tEvents.sort((a, b) => a.tick - b.tick).forEach(ev => {
          let delta = Math.max(0, ev.tick - lastTick);
          lastTick = ev.tick;
          trackBytes = trackBytes.concat(writeVarInt(delta));
          if (ev.type === 'on') {
            trackBytes.push(0x90 | (chIdx & 0x0F), ev.note, ev.vel);
          } else {
            trackBytes.push(0x80 | (chIdx & 0x0F), ev.note, 0);
          }
        });

        trackBytes.push(0x00, 0xFF, 0x2F, 0x00);
        const trackHeader = [0x4D, 0x54, 0x72, 0x6B].concat(numToBytes(trackBytes.length, 4));
        tracksBytes.push(trackHeader.concat(trackBytes));
      });

      const numTracks = tracksBytes.length;
      const header = [
        0x4D, 0x54, 0x68, 0x64,
        0x00, 0x00, 0x00, 0x06,
        0x00, 0x01,
        (numTracks >> 8) & 0xFF, numTracks & 0xFF,
        (ticksPerBeat >> 8) & 0xFF, ticksPerBeat & 0xFF
      ];

      let allBytes = header;
      tracksBytes.forEach(tb => { allBytes = allBytes.concat(tb); });
      return new Uint8Array(allBytes);
    }

    // 點擊提煉生成（加入防禦性檢查）
    document.getElementById('generateMidiBtn').addEventListener('click', () => {
      logStatus('⚡ 正在安全掃描樂譜軌道並提煉 MIDI...', 'info');
      if (!currentScore) return;

      try {
        const selectedIndices = Array.from(document.querySelectorAll('.track-cb:checked'))
          .map(cb => parseInt(cb.getAttribute('data-index'), 10));

        if (selectedIndices.length === 0) {
          logStatus('⚠️ 請至少勾選一條音軌！', 'error');
          return;
        }

        const ticksPerQuarter = 96;
        const tracksData = [];

        selectedIndices.forEach((trackIdx) => {
          const trackData = currentScore.tracks[trackIdx];
          const events = [];
          let currentTick = 0;

          if (trackData && trackData.staffs) {
            trackData.staffs.forEach(staff => {
              if (staff && staff.bars) {
                staff.bars.forEach(bar => {
                  if (bar && bar.voices) {
                    bar.voices.forEach(voice => {
                      let barTick = 0;
                      if (voice && voice.beats) {
                        voice.beats.forEach(beat => {
                          let durationRatio = 1 / (beat.duration || 4);
                          let beatTicks = Math.round(durationRatio * (ticksPerQuarter * 4));
                          if (beat.dots === 1) beatTicks = Math.round(beatTicks * 1.5);

                          if (beat.notes && beat.notes.length > 0) {
                            beat.notes.forEach(n => {
                              if (n && typeof n.realValue === 'number') {
                                events.push({ tick: currentTick + barTick, type: 'on', note: n.realValue, vel: 90 });
                                events.push({ tick: currentTick + barTick + beatTicks - 2, type: 'off', note: n.realValue });
                              }
                            });
                          }
                          barTick += beatTicks;
                        });
                      }
                    });
                  }
                  let num = bar?.masterBar?.timeSignatureNumerator || 4;
                  let den = bar?.masterBar?.timeSignatureDenominator || 4;
                  currentTick += (num / den) * (ticksPerQuarter * 4);
                });
              }
            });
          }

          tracksData.push(events);
        });

        currentMidiUint8 = buildNativeMidi(tracksData, currentScore.tempo || 120);

        midiArea.style.display = 'block';
        logStatus(`🎉 獨立安全引擎提煉成功！大小: ${currentMidiUint8.byteLength} bytes`, 'success');
      } catch (err) {
        console.error(err);
        logStatus(`❌ 生成失敗: ${err.message}`, 'error');
      }
    });

    midiPlayBtn.addEventListener('click', async () => {
      if (!currentMidiUint8) return;
      if (isGpPlaying) api.pause();
      await Tone.start();

      if (isMidiPlaying) {
        stopMidi();
      } else {
        try {
          midiPlayer.loadArrayBuffer(currentMidiUint8.slice().buffer);
          midiPlayer.play();
          isMidiPlaying = true;
          midiPlayBtn.innerText = '⏹ 停止 MIDI';
          logStatus('▶ 正在試聽提煉的 MIDI 音色...', 'success');
        } catch(err) {
          logStatus(`❌ 試聽失敗: ${err.message}`, 'error');
        }
      }
    });

    function stopMidi() {
      if (midiPlayer) midiPlayer.stop();
      isMidiPlaying = false;
      midiPlayBtn.innerText = '▶ 試聽生成 MIDI';
    }

    document.getElementById('downloadMidiBtn').addEventListener('click', () => {
      if (!currentMidiUint8) return;
      const blob = new Blob([currentMidiUint8], { type: 'audio/midi' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${(currentScore.title || 'extracted').replace(/\s+/g, '_')}_custom.mid`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      logStatus('📥 正宗 .mid 檔案已下載！', 'success');
    });
  </script>
</body>
</html>
