<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcatdia GP & MIDI 雙核心工作站</title>
  <script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.3.0/dist/alphaTab.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/midi-player-js@2.0.16/browser/midiplayer.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f13;
      color: #eee;
      padding: 16px;
      margin: 0;
      max-width: 550px;
      margin: auto;
    }
    h2 { color: #00d2ff; text-align: center; margin-bottom: 4px; font-size: 20px; }
    p.desc { text-align: center; color: #4ade80; font-size: 13px; margin-top: 0; font-weight: bold; }
    .card {
      background: #191922;
      border: 1px solid #282836;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    input[type="file"] {
      display: block;
      width: 100%;
      padding: 12px;
      background: #232330;
      border: 1px dashed #444;
      border-radius: 8px;
      color: #fff;
    }
    .track-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 4px;
      border-bottom: 1px solid #22222e;
    }
    .track-row:last-child { border-bottom: none; }
    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-main { background: #00d2ff; color: #000; }
    .btn-action { background: #333346; color: #00d2ff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    .btn-midi-play { background: #4ade80; color: #000; font-size: 13px; padding: 8px 16px; font-weight: bold; }
    
    #statusBox {
      background: #050508;
      border: 1px solid #00d2ff;
      border-radius: 8px;
      padding: 10px 12px;
      font-family: monospace;
      font-size: 12px;
      margin-top: 10px;
      line-height: 1.4;
      word-break: break-all;
    }
    .log-info { color: #00d2ff; }
    .log-success { color: #4ade80; font-weight: bold; }
    .log-error { color: #ff3366; font-weight: bold; }
    
    .seek-container {
      background: #14141c;
      border: 1px solid #33334a;
      border-radius: 8px;
      padding: 12px;
      margin: 12px 0;
    }
    .seek-meta {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-family: monospace;
      color: #00d2ff;
      margin-bottom: 6px;
    }
    .seek-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 4px;
      background: #2b2b3d;
      outline: none;
    }
    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #00d2ff;
      cursor: pointer;
    }

    .bar-btn-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 10px;
    }
    .btn-step {
      background: #252536;
      color: #00d2ff;
      border: 1px solid #3b3b52;
      border-radius: 6px;
      padding: 8px 0;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-step:active {
      background: #00d2ff;
      color: #000;
    }

    .midi-box {
      background: #121218;
      border: 1.5px solid #4ade80;
      border-radius: 8px;
      padding: 12px;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <h2>🎸 GP 拆軌 & MIDI 雙試聽工作站</h2>
  <p class="desc">⚡ v3.6 正宗二進制修復版</p>

  <div id="statusBox">
    <div id="statusText" class="log-info">⚙️ 系統就緒，等待樂譜...</div>
  </div>

  <div class="card" style="margin-top: 12px;">
    <label style="display:block; font-weight:bold; margin-bottom:8px;">1. 選擇 GP 樂譜 (.gp3, .gp4, .gp5)</label>
    <input type="file" id="filePicker" accept=".gp3,.gp4,.gp5,.gpx,.gp">
  </div>

  <div id="gpCard" class="card" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <div>
        <div id="songTitle" style="font-weight:bold; font-size:16px; color:#fff;"></div>
        <div id="songTempo" style="font-size:12px; color:#888;"></div>
      </div>
      <button class="btn-action" id="gpPlayBtn" style="font-size:13px; padding:8px 12px;">▶ GTP 播放</button>
    </div>

    <!-- 小節與時間拉桿 -->
    <div class="seek-container">
      <div class="seek-meta">
        <span id="barDisplay">小節: Bar 1 / 1</span>
        <span id="timeDisplay">00:00 / 00:00</span>
      </div>
      <input type="range" id="seekSlider" class="seek-slider" min="1" max="100" value="1">
      
      <div class="bar-btn-group">
        <button class="btn-step" onclick="stepBar(-4)">⏪ -4 Bar</button>
        <button class="btn-step" onclick="stepBar(-1)">◀ -1 Bar</button>
        <button class="btn-step" onclick="stepBar(1)">+1 Bar ▶</button>
        <button class="btn-step" onclick="stepBar(4)">+4 Bar ⏩</button>
      </div>
    </div>

    <label style="font-weight:bold; font-size:13px; display:block; margin-bottom:6px; color:#00d2ff;">2. 選擇你要合成的多音軌：</label>
    <div id="trackList"></div>

    <button class="btn btn-main" id="generateMidiBtn">⚡ 提煉所選音軌生成 MIDI</button>

    <div id="midiArea" class="midi-box" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span style="font-size:13px; font-weight:bold; color:#4ade80;">🎹 生成的 MIDI 已就緒：</span>
        <button class="btn-action btn-midi-play" id="midiPlayBtn">▶ 試聽生成 MIDI</button>
      </div>
      <button class="btn" id="downloadMidiBtn" style="background:#4ade80; color:#000;">📥 下載此 MIDI 檔案 (.mid)</button>
    </div>
  </div>

  <div id="alphaTabEngine" style="display:none;"></div>

  <script>
    let api = null;
    let currentScore = null;
    let isGpPlaying = false;
    let totalBars = 1;
    let currentBarIndex = 1;
    let isUserDragging = false;

    let midiPlayer = null;
    let synth = null;
    let currentMidiUint8 = null;
    let isMidiPlaying = false;

    const statusText = document.getElementById('statusText');
    const barDisplay = document.getElementById('barDisplay');
    const timeDisplay = document.getElementById('timeDisplay');
    const seekSlider = document.getElementById('seekSlider');

    function logStatus(msg, type = 'info') {
      if (!statusText) return;
      statusText.className = type === 'error' ? 'log-error' : (type === 'success' ? 'log-success' : 'log-info');
      statusText.innerText = msg;
    }

    function formatTime(ms) {
      const totalSec = Math.floor((ms || 0) / 1000);
      const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
      const s = (totalSec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('alphaTabEngine');
      api = new alphaTab.AlphaTabApi(container, {
        player: {
          enablePlayer: true,
          soundFont: 'https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.3.0/dist/soundfont/sonivox.sf2'
        }
      });

      api.soundFontLoaded.on(() => {
        logStatus('✅ 引擎已就緒，請載入樂譜！', 'success');
      });

      api.playerStateChanged.on((args) => {
        isGpPlaying = (args.state === 1);
        document.getElementById('gpPlayBtn').innerText = isGpPlaying ? '⏹ 停止 GTP' : '▶ GTP 播放';
      });

      api.playerPositionChanged.on((args) => {
        if (isUserDragging) return;

        timeDisplay.innerText = `${formatTime(args.currentTime)} / ${formatTime(args.endTime)}`;
        
        if (args.currentMasterBar) {
          currentBarIndex = args.currentMasterBar.index + 1;
          barDisplay.innerText = `小節: Bar ${currentBarIndex} / ${totalBars}`;
          seekSlider.value = currentBarIndex;
        }
      });

      // 初始化 Tone 合成器
      synth = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "sawtooth" },
        envelope: { attack: 0.01, decay: 0.2, sustain: 0.2, release: 0.8 }
      }).toDestination();

      midiPlayer = new MidiPlayer.Player((event) => {
        if (event.name === 'Note on' && event.velocity > 0) {
          try {
            const freq = Tone.Frequency(event.noteNumber, "midi");
            synth.triggerAttackRelease(freq, "8n", undefined, event.velocity / 127);
          } catch(e) {}
        }
      });

      midiPlayer.on('endOfFile', () => {
        isMidiPlaying = false;
        document.getElementById('midiPlayBtn').innerText = '▶ 試聽生成 MIDI';
        logStatus('🏁 MIDI 試聽播放完畢', 'info');
      });
    });

    const filePicker = document.getElementById('filePicker');
    const gpCard = document.getElementById('gpCard');
    const trackList = document.getElementById('trackList');
    const midiArea = document.getElementById('midiArea');
    const midiPlayBtn = document.getElementById('midiPlayBtn');

    filePicker.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      logStatus(`⏳ 讀取樂譜: ${file.name}...`, 'info');
      try {
        const arrayBuffer = await file.arrayBuffer();
        const rawBytes = new Uint8Array(arrayBuffer);

        currentScore = alphaTab.importer.ScoreLoader.loadScoreFromBytes(rawBytes);
        api.renderScore(currentScore);

        totalBars = currentScore.masterBars.length;
        currentBarIndex = 1;
        seekSlider.min = 1;
        seekSlider.max = totalBars;
        seekSlider.value = 1;
        barDisplay.innerText = `小節: Bar 1 / ${totalBars}`;
        timeDisplay.innerText = `00:00 / 00:00`;

        document.getElementById('songTitle').innerText = currentScore.title || file.name;
        document.getElementById('songTempo').innerText = `原曲速度: ${currentScore.tempo} BPM`;

        trackList.innerHTML = '';
        currentScore.tracks.forEach((track, index) => {
          const row = document.createElement('div');
          row.className = 'track-row';
          row.innerHTML = `
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
              <input type="checkbox" class="track-cb" data-index="${index}" checked>
              <span style="font-size:14px;">${track.name || `軌道 ${index + 1}`}</span>
            </label>
            <div>
              <button class="btn-action" onclick="soloPlayTrack(${index})">獨奏 GTP</button>
            </div>
          `;
          trackList.appendChild(row);
        });

        gpCard.style.display = 'block';
        midiArea.style.display = 'none';
        logStatus(`✅ 樂譜加載完成！共 ${totalBars} 小節。`, 'success');
      } catch (err) {
        logStatus(`❌ 解析失敗: ${err.message}`, 'error');
      }
    });

    function jumpToBar(target) {
      if (!api || !currentScore) return;
      currentBarIndex = Math.max(1, Math.min(totalBars, target));
      seekSlider.value = currentBarIndex;
      barDisplay.innerText = `小節: Bar ${currentBarIndex} / ${totalBars}`;

      const masterBar = currentScore.masterBars[currentBarIndex - 1];
      if (masterBar) {
        api.tickPosition = masterBar.start;
        logStatus(`🎯 已定位至第 ${currentBarIndex} 小節`, 'info');
        if (!isGpPlaying) api.play();
      }
    }

    window.stepBar = function(offset) {
      jumpToBar(currentBarIndex + offset);
    };

    seekSlider.addEventListener('input', (e) => {
      isUserDragging = true;
      const target = parseInt(e.target.value, 10);
      barDisplay.innerText = `小節: Bar ${target} / ${totalBars} (放手定位)`;
    });

    seekSlider.addEventListener('change', (e) => {
      isUserDragging = false;
      jumpToBar(parseInt(e.target.value, 10));
    });

    document.getElementById('gpPlayBtn').addEventListener('click', () => {
      if (!api) return;
      if (isMidiPlaying) stopMidi();
      api.playPause();
    });

    window.soloPlayTrack = function(index) {
      if (!api || !currentScore) return;
      if (isMidiPlaying) stopMidi();
      currentScore.tracks.forEach((t, i) => {
        api.changeTrackMute([t], i !== index);
      });
      if (!isGpPlaying) api.play();
      logStatus(`🎵 正在獨奏: ${currentScore.tracks[index].name || (index + 1)}`, 'info');
    };

    // 🎯 正宗 MIDI 導出二進制轉碼器
    document.getElementById('generateMidiBtn').addEventListener('click', () => {
      logStatus('⚡ 正在轉換正宗 MIDI 二進制數據...', 'info');
      if (!currentScore) return;

      try {
        const selectedIndices = Array.from(document.querySelectorAll('.track-cb:checked'))
          .map(cb => parseInt(cb.getAttribute('data-index'), 10));

        if (selectedIndices.length === 0) {
          logStatus('⚠️ 請至少勾選一條音軌！', 'error');
          return;
        }

        currentScore.tracks.forEach((t, idx) => {
          t.playbackInfo.isMute = !selectedIndices.includes(idx);
        });

        // 調用 AlphaTab 匯出實例
        const midiExporter = new alphaTab.exporter.MidiExport();
        const rawMidi = midiExporter.export(currentScore, api.settings);

        // 確保將 AlphaTab 內部的二進制數據流轉化為標準 Uint8Array
        if (rawMidi instanceof Uint8Array) {
          currentMidiUint8 = rawMidi;
        } else if (rawMidi.toBinary) {
          currentMidiUint8 = rawMidi.toBinary();
        } else if (rawMidi.buffer) {
          currentMidiUint8 = new Uint8Array(rawMidi.buffer);
        } else if (Array.isArray(rawMidi)) {
          currentMidiUint8 = new Uint8Array(rawMidi);
        } else {
          // 透過底層 ByteArray 讀取
          const bytes = [];
          for (let i = 0; i < (rawMidi.length || rawMidi.capacity || 0); i++) {
            bytes.push(rawMidi.get ? rawMidi.get(i) : rawMidi[i]);
          }
          currentMidiUint8 = new Uint8Array(bytes);
        }

        if (!currentMidiUint8 || currentMidiUint8.byteLength < 50) {
          throw new Error(`MIDI 轉換異常，數據長度不足 (${currentMidiUint8 ? currentMidiUint8.byteLength : 0} bytes)`);
        }

        midiArea.style.display = 'block';
        logStatus(`🎉 提煉成功！正宗 MIDI 大小: ${Math.round(currentMidiUint8.byteLength / 1024)} KB，已解鎖試聽！`, 'success');
      } catch (err) {
        console.error(err);
        logStatus(`❌ 生成失敗: ${err.message}`, 'error');
      }
    });

    // 🎯 點擊啟動 Tone.js 實時試聽（徹底突破手機靜音限制）
    midiPlayBtn.addEventListener('click', async () => {
      if (!currentMidiUint8) return;

      if (isGpPlaying) api.pause();

      // 強制喚醒手機瀏覽器 AudioContext
      await Tone.start();

      if (isMidiPlaying) {
        stopMidi();
      } else {
        try {
          // 複製獨立 ArrayBuffer 供播放器讀取
          const playBuffer = currentMidiUint8.slice().buffer;
          midiPlayer.loadArrayBuffer(playBuffer);
          midiPlayer.play();
          isMidiPlaying = true;
          midiPlayBtn.innerText = '⏹ 停止 MIDI';
          logStatus('▶ 正在試聽生成的 MIDI 音色...', 'success');
        } catch(err) {
          logStatus(`❌ MIDI 試聽失敗: ${err.message}`, 'error');
        }
      }
    });

    function stopMidi() {
      if (midiPlayer) midiPlayer.stop();
      isMidiPlaying = false;
      midiPlayBtn.innerText = '▶ 試聽生成 MIDI';
      logStatus('⏹ 已停止試聽', 'info');
    }

    // 🎯 鎖死二進制 Octet-stream，拒絕 .rtx
    document.getElementById('downloadMidiBtn').addEventListener('click', () => {
      if (!currentMidiUint8) return;

      const blob = new Blob([currentMidiUint8], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${(currentScore.title || 'extracted').replace(/\s+/g, '_')}_custom.mid`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      logStatus('📥 正宗 .mid 檔案已下載，可直接拖入 Logic Pro！', 'success');
    });
  </script>
</body>
</html>
